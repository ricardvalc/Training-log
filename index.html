<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15130f">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#15130f; --paper:#ece3cf; --paper-dim:#ddd2b6; --paper-deep:#c9bd9c;
    --hero:#f2b90f; --punch:#d1273c; --ink:#221d15; --bone:#f4f0e4;
    --steel:#8b8371; --steel-dark:#4a4436; --green:#5c7a4a; --blue:#3f6b7d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--void);color:var(--bone);
    font-family:'IBM Plex Sans',-apple-system,sans-serif;}
  body{padding:calc(20px + env(safe-area-inset-top)) 14px calc(50px + env(safe-area-inset-bottom));
    max-width:620px;margin:0 auto;}
  h1,h2{font-family:'Bebas Neue',sans-serif;letter-spacing:.02em;margin:0;}

  .hero{padding:20px 18px;border:2px solid var(--steel-dark);border-radius:4px;margin-bottom:14px;
    background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(255,255,255,.02) 27px 28px);}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .day-count{font-family:'Bebas Neue';font-size:58px;line-height:.85;color:var(--hero);}
  .day-count span{font-size:17px;color:var(--bone);display:block;font-family:'IBM Plex Mono';letter-spacing:.06em;margin-top:6px;}
  .phase-tag{text-align:right;flex-shrink:0;}
  .phase-tag .name{font-family:'Bebas Neue';font-size:24px;}
  .phase-tag .sub{font-family:'IBM Plex Mono';font-size:10px;color:var(--steel);margin-top:2px;}
  .wedding-strip{margin-top:12px;font-family:'IBM Plex Mono';font-size:11px;color:var(--steel);
    border-top:1px dashed var(--steel-dark);padding-top:9px;}
  .wedding-strip b{color:var(--hero);}

  .card{background:var(--paper);color:var(--ink);border-radius:4px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden;}
  .card h2{font-size:21px;margin-bottom:12px;}

  /* RATING */
  .rating-wrap{display:flex;align-items:center;gap:16px;}
  .grade{font-family:'Bebas Neue';font-size:66px;line-height:.8;width:92px;text-align:center;
    border:4px solid var(--ink);border-radius:6px;padding:10px 0;}
  .rating-detail{flex:1;}
  .rating-line{display:flex;justify-content:space-between;font-family:'IBM Plex Mono';font-size:11px;margin-bottom:5px;}
  .rating-line .v{font-weight:600;}
  .mini-track{height:5px;background:var(--paper-deep);border-radius:3px;overflow:hidden;margin-bottom:9px;}
  .mini-fill{height:100%;border-radius:3px;}

  .weight-nums{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap;}
  .weight-nums .cur{font-family:'Bebas Neue';font-size:42px;color:var(--punch);}
  .weight-nums .arrow{font-family:'IBM Plex Mono';font-size:12px;color:var(--steel-dark);}
  .weight-nums .goal{font-family:'Bebas Neue';font-size:21px;color:var(--steel-dark);}
  .weight-nums .delta{font-family:'IBM Plex Mono';font-size:12px;margin-left:auto;}
  .bar-track{height:10px;background:var(--paper-dim);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--punch);border-radius:6px;transition:width .4s ease;}

  .spark{width:100%;height:56px;margin-top:12px;display:block;}

  .ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .ex-box{background:var(--paper-dim);border-radius:4px;padding:10px;}
  .ex-box .lbl{font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel-dark);}
  .ex-box .nums{display:flex;align-items:baseline;gap:5px;margin:5px 0 8px;}
  .ex-box input{width:56px;font-family:'IBM Plex Mono';font-size:17px;font-weight:600;border:none;
    background:transparent;color:var(--ink);border-bottom:2px solid var(--steel);padding:0 0 2px;}
  .ex-box .target{font-family:'IBM Plex Mono';font-size:13px;color:var(--steel);}

  .run-row{display:flex;gap:9px;margin-top:9px;}
  .run-row .ex-box{flex:1;}
  .pace-out{font-family:'IBM Plex Mono';font-size:12px;color:var(--steel-dark);margin-top:9px;text-align:center;
    background:var(--paper-dim);border-radius:4px;padding:8px;}
  .pace-out b{color:var(--ink);font-size:14px;}

  .rest-toggle{display:flex;align-items:center;gap:8px;margin-top:11px;font-family:'IBM Plex Mono';
    font-size:12px;color:var(--steel-dark);cursor:pointer;}
  .rest-toggle input{width:17px;height:17px;}

  .stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-13deg) scale(0);
    font-family:'Bebas Neue';font-size:48px;color:var(--punch);border:5px solid var(--punch);
    padding:3px 20px;border-radius:8px;pointer-events:none;opacity:0;letter-spacing:.05em;
    transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s;}
  .stamp.show{transform:translate(-50%,-50%) rotate(-13deg) scale(1);opacity:.85;}

  .strip{display:flex;gap:5px;}
  .strip .d{flex:1;aspect-ratio:1;border-radius:4px;background:var(--paper-dim);display:flex;
    align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:10px;color:var(--steel-dark);}
  .strip .d.full{background:var(--green);color:var(--bone);}
  .strip .d.partial{background:var(--hero);}
  .strip .d.rest{background:var(--steel);color:var(--bone);}
  .strip .d.future{background:transparent;border:1px dashed var(--steel);color:var(--steel);}
  .streak{font-family:'IBM Plex Mono';font-size:11px;color:var(--steel-dark);margin-top:10px;}

  .tl-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:4px;
    background:var(--paper-dim);margin-bottom:7px;}
  .tl-item.active{background:var(--hero);}
  .tl-item .num{font-family:'Bebas Neue';font-size:19px;width:22px;color:var(--steel-dark);}
  .tl-item .txt{font-family:'IBM Plex Mono';font-size:11px;}
  .tl-item .txt b{font-family:'IBM Plex Sans';font-size:12px;display:block;}

  .hist-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;
    border-bottom:1px solid var(--paper-dim);font-family:'IBM Plex Mono';font-size:11px;}
  .hist-row:last-child{border-bottom:none;}
  .hist-row .del{color:var(--punch);cursor:pointer;font-size:14px;background:none;border:none;padding:2px 5px;}
  .empty{color:var(--steel);font-family:'IBM Plex Mono';font-size:12px;padding:8px 0;}

  details{margin-bottom:14px;}
  summary{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--steel);cursor:pointer;padding:6px 0;}
  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-family:'IBM Plex Mono';font-size:9px;color:var(--steel-dark);
    text-transform:uppercase;letter-spacing:.06em;}
  input[type=number],input[type=date]{background:var(--bone);border:1px solid var(--steel);border-radius:3px;
    padding:7px 8px;font-family:'IBM Plex Mono';font-size:16px;color:var(--ink);width:100%;}
  button.primary{background:var(--punch);color:var(--bone);border:none;border-radius:3px;padding:9px 14px;
    font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
  button.ghost{background:var(--steel-dark);}
  .notice{font-family:'IBM Plex Mono';font-size:11px;line-height:1.5;margin-bottom:11px;}
  .notice.warn{color:var(--punch);font-weight:600;}
  .loading{text-align:center;padding:60px 0;font-family:'IBM Plex Mono';color:var(--steel);}
</style>
</head>
<body>
<div id="app" class="loading">loading training log…</div>
<script>
const K_PROFILE='opm-profile', K_LOGS='opm-logs';

/* ---------- storage: try artifact bridge, then localStorage, always honest ---------- */
let mem={}, mode='unknown', broken=false;
const bridgeOk=()=>!broken&&typeof window!=='undefined'&&window.storage
  &&typeof window.storage.get==='function'&&typeof window.storage.set==='function';

async function sGet(k){
  if(bridgeOk()){
    try{ const r=await window.storage.get(k,false); mode='synced'; return r?r.value:null; }
    catch(e){ mode='synced'; return null; }
  }
  try{ if(typeof localStorage!=='undefined'){ const v=localStorage.getItem(k); mode='device'; return v; } }catch(e){}
  mode='session'; return mem[k]??null;
}
async function sSet(k,v){
  mem[k]=v;
  if(bridgeOk()){
    try{ await window.storage.set(k,v,false); mode='synced'; return; }
    catch(e){ broken=true; }
  }
  try{ if(typeof localStorage!=='undefined'){ localStorage.setItem(k,v); mode='device'; return; } }catch(e){}
  mode='session';
}
function notice(){
  if(mode==='synced') return {t:'Saved automatically. Your log persists between sessions.',w:false};
  if(mode==='device') return {t:'Saved in this browser. Keep using the same browser and your history stays put. Download a backup now and then.',w:false};
  return {t:'Storage is unavailable here — entries will vanish when you close this. Download a backup before you leave.',w:true};
}

/* ---------- dates ---------- */
const DAY=86400000;
const iso=(d=new Date())=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10);};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d);};
const between=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/DAY);

let profile=null, logs={};
const defProfile=()=>({startDate:iso(),startWeight:70,goalWeight:64,weddingDate:addDays(iso(),30)});

/* ---------- programme ---------- */
function targetFor(week){
  if(week<=4) return {reps:Math.min(45,30+5*(week-1)),run:3};
  if(week<=8) return {reps:50,run:5};
  if(week<=12) return {reps:70,run:7};
  if(week<=16) return {reps:90,run:week<=14?8:9};
  return {reps:100,run:10};
}
function phaseFor(week){
  if(week<=4) return {name:'Phase 1',sub:'deficit · wedding prep'};
  if(week<=16) return {name:'Phase 2',sub:'ramp to full routine'};
  return {name:'Full Routine',sub:'maintain'};
}

function blank(){return{pushups:0,situps:0,squats:0,run:0,runMin:0,weight:null,rest:false};}
function getLog(d){ if(!logs[d]) logs[d]=blank(); return logs[d]; }

async function save(){ await sSet(K_PROFILE,JSON.stringify(profile)); await sSet(K_LOGS,JSON.stringify(logs)); }
async function load(){
  try{ const p=await sGet(K_PROFILE); profile=p?JSON.parse(p):defProfile(); }catch(e){ profile=defProfile(); }
  try{ const l=await sGet(K_LOGS); logs=l?JSON.parse(l):{}; }catch(e){ logs={}; }
  if(!profile) profile=defProfile();
}

/* ---------- derived stats ---------- */
function status(d,t){
  const l=logs[d]; if(!l) return 'none';
  if(l.rest) return 'rest';
  const hit=l.pushups>=t.reps&&l.situps>=t.reps&&l.squats>=t.reps&&l.run>=t.run;
  if(hit) return 'full';
  return (l.pushups||l.situps||l.squats||l.run)?'partial':'none';
}
function weightSeries(){
  return Object.keys(logs).filter(d=>logs[d].weight).sort().map(d=>({d,w:logs[d].weight}));
}
function latestWeight(){ const s=weightSeries(); return s.length?s[s.length-1].w:profile.startWeight; }
function bestPace(){
  let best=null;
  for(const d in logs){ const l=logs[d];
    if(l.run>=1&&l.runMin>0){ const p=l.runMin/l.run; if(best===null||p<best) best=p; } }
  return best;
}
function recentPace(){
  const ds=Object.keys(logs).filter(d=>logs[d].run>=1&&logs[d].runMin>0).sort();
  if(!ds.length) return null;
  const last=ds.slice(-3).map(d=>logs[d].runMin/logs[d].run);
  return last.reduce((a,b)=>a+b,0)/last.length;
}
function streak(){
  let n=0, d=iso();
  while(true){ const l=logs[d];
    if(!l) break;
    if(l.rest){ d=addDays(d,-1); continue; }
    if(l.pushups||l.situps||l.squats||l.run){ n++; d=addDays(d,-1); } else break; }
  return n;
}
function fmtPace(p){ if(p===null||!isFinite(p)) return '—'; const m=Math.floor(p), s=Math.round((p-m)*60); return `${m}:${String(s).padStart(2,'0')}/km`; }

/* Fitness rating: consistency + volume vs target + pace, 0-100 */
function rating(week){
  const t=targetFor(week);
  const days=Object.keys(logs).sort();
  const recent=days.slice(-14);
  let consistency=0, volume=0, counted=0;
  recent.forEach(d=>{
    const l=logs[d]; if(l.rest) return;
    counted++;
    const done=(l.pushups||0)+(l.situps||0)+(l.squats||0);
    const tgt=t.reps*3;
    if(done>0||l.run>0) consistency++;
    volume+=Math.min(1,(done/tgt)*0.6+(Math.min(1,(l.run||0)/t.run))*0.4);
  });
  const cScore=counted?(consistency/Math.max(counted,5))*100:0;
  const vScore=counted?(volume/counted)*100:0;
  const rp=recentPace();
  let pScore=rp===null?null:Math.max(0,Math.min(100,(8.5-rp)/(8.5-4.5)*100));
  const parts=[cScore*0.4,vScore*0.4];
  let total=parts[0]+parts[1];
  if(pScore!==null) total+=pScore*0.2; else total=total/0.8;
  total=Math.max(0,Math.min(100,total));
  let grade='F';
  if(total>=90)grade='S';else if(total>=78)grade='A';else if(total>=64)grade='B';
  else if(total>=48)grade='C';else if(total>=30)grade='D';else if(total>=12)grade='E';
  return {total:Math.round(total),grade,cScore:Math.round(cScore),vScore:Math.round(vScore),pScore:pScore===null?null:Math.round(pScore)};
}

/* ---------- weight sparkline ---------- */
function sparkline(){
  const s=weightSeries();
  if(s.length<2) return `<div class="empty">Log weight on two different days to see your trend.</div>`;
  const ws=s.map(p=>p.w), min=Math.min(...ws,profile.goalWeight), max=Math.max(...ws);
  const rng=(max-min)||1, W=300,H=56,pad=4;
  const pts=s.map((p,i)=>{
    const x=pad+(i/(s.length-1))*(W-pad*2);
    const y=H-pad-((p.w-min)/rng)*(H-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const gy=H-pad-((profile.goalWeight-min)/rng)*(H-pad*2);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Weight trend">
    <line x1="0" y1="${gy.toFixed(1)}" x2="${W}" y2="${gy.toFixed(1)}" stroke="#5c7a4a" stroke-width="1" stroke-dasharray="4 4"/>
    <polyline points="${pts}" fill="none" stroke="#d1273c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

/* ---------- render ---------- */
function render(){
  const today=iso();
  const dayNum=Math.max(1,between(profile.startDate,today)+1);
  const week=Math.max(1,Math.ceil(dayNum/7));
  const t=targetFor(week), ph=phaseFor(week);
  const toWed=between(today,profile.weddingDate);
  const cur=latestWeight();
  const toLose=profile.startWeight-profile.goalWeight;
  const lost=profile.startWeight-cur;
  const pct=toLose>0?Math.max(0,Math.min(100,(lost/toLose)*100)):0;
  const l=getLog(today);
  const r=rating(week);
  const n=notice();
  const pace=(l.run>0&&l.runMin>0)?l.runMin/l.run:null;

  document.getElementById('app').className='';
  document.getElementById('app').innerHTML=`
  <div class="hero">
    <div class="hero-top">
      <div class="day-count">${dayNum}<span>DAY OF TRAINING</span></div>
      <div class="phase-tag"><div class="name">${ph.name}</div><div class="sub">${ph.sub} · wk ${week}</div></div>
    </div>
    <div class="wedding-strip">${toWed>=0?`<b>${toWed}</b> days to the wedding`:`wedding was <b>${Math.abs(toWed)}</b> days ago`}</div>
  </div>

  <details><summary>Setup — weights, dates</summary>
    <div class="settings-grid">
      <div class="field"><label>Start weight (kg)</label><input type="number" id="s-sw" value="${profile.startWeight}" step="0.1" inputmode="decimal"></div>
      <div class="field"><label>Goal weight (kg)</label><input type="number" id="s-gw" value="${profile.goalWeight}" step="0.1" inputmode="decimal"></div>
      <div class="field"><label>Programme start</label><input type="date" id="s-sd" value="${profile.startDate}"></div>
      <div class="field"><label>Wedding date</label><input type="date" id="s-wd" value="${profile.weddingDate}"></div>
    </div>
    <button class="primary" id="b-setup" style="margin-top:9px;">Save setup</button>
  </details>

  <div class="card">
    <h2>Fitness Rating</h2>
    <div class="rating-wrap">
      <div class="grade" style="color:${r.total>=64?'#5c7a4a':r.total>=30?'#221d15':'#d1273c'}">${r.grade}<div style="font-family:'IBM Plex Mono';font-size:11px;letter-spacing:0;">${r.total}/100</div></div>
      <div class="rating-detail">
        <div class="rating-line"><span>Consistency</span><span class="v">${r.cScore}</span></div>
        <div class="mini-track"><div class="mini-fill" style="width:${r.cScore}%;background:var(--green)"></div></div>
        <div class="rating-line"><span>Volume vs target</span><span class="v">${r.vScore}</span></div>
        <div class="mini-track"><div class="mini-fill" style="width:${r.vScore}%;background:var(--hero)"></div></div>
        <div class="rating-line"><span>Running pace</span><span class="v">${r.pScore===null?'no runs timed':r.pScore}</span></div>
        <div class="mini-track"><div class="mini-fill" style="width:${r.pScore||0}%;background:var(--blue)"></div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Weight</h2>
    <div class="weight-nums">
      <div class="cur">${cur}kg</div><div class="arrow">→</div><div class="goal">${profile.goalWeight}kg</div>
      <div class="delta" style="color:${lost>0?'#5c7a4a':'#8b8371'}">${lost>0?'-':''}${Math.abs(lost).toFixed(1)}kg so far</div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
    ${sparkline()}
    <div style="display:flex;gap:8px;margin-top:10px;">
      <input type="number" id="in-w" placeholder="today's weight (kg)" step="0.1" inputmode="decimal" value="${l.weight??''}" style="flex:1">
      <button class="primary" id="b-w">Log</button>
    </div>
  </div>

  <div class="card">
    <h2>Today · ${t.reps} reps + ${t.run}km</h2>
    <div class="ex-grid">
      ${['pushups','situps','squats'].map(k=>`
        <div class="ex-box"><div class="lbl">${k}</div>
          <div class="nums"><input type="number" inputmode="numeric" data-k="${k}" class="ex" value="${l[k]}" min="0"><span class="target">/ ${t.reps}</span></div>
          <div class="mini-track"><div class="mini-fill" style="width:${Math.min(100,l[k]/t.reps*100)}%;background:var(--green)"></div></div>
        </div>`).join('')}
      <div class="ex-box"><div class="lbl">run · km</div>
        <div class="nums"><input type="number" inputmode="decimal" data-k="run" class="ex" value="${l.run}" min="0" step="0.1"><span class="target">/ ${t.run}</span></div>
        <div class="mini-track"><div class="mini-fill" style="width:${Math.min(100,l.run/t.run*100)}%;background:var(--green)"></div></div>
      </div>
    </div>
    <div class="run-row">
      <div class="ex-box"><div class="lbl">run time · minutes</div>
        <div class="nums"><input type="number" inputmode="decimal" data-k="runMin" class="ex" value="${l.runMin}" min="0" step="0.5"><span class="target">min</span></div>
      </div>
    </div>
    <div class="pace-out">Today's pace <b>${fmtPace(pace)}</b> &nbsp;·&nbsp; best ever <b>${fmtPace(bestPace())}</b></div>
    <label class="rest-toggle"><input type="checkbox" id="c-rest" ${l.rest?'checked':''}> mark today as a rest day</label>
    <div class="stamp" id="stamp">CLEARED</div>
  </div>

  <div class="card">
    <h2>This Week</h2>
    <div class="strip">${Array.from({length:7}).map((_,i)=>{
      const base=new Date(today+'T00:00:00');
      const d=addDays(today,i-((base.getDay()+6)%7));
      const st=d>today?'future':status(d,t);
      const lbl=new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'})[0];
      return `<div class="d ${st}" title="${d}">${lbl}</div>`;}).join('')}</div>
    <div class="streak">Current streak: <b>${streak()}</b> day${streak()===1?'':'s'}</div>
  </div>

  <div class="card">
    <h2>Roadmap</h2>
    <div class="tl-item ${week<=4?'active':''}"><div class="num">1</div><div class="txt"><b>Phase 1 · wk 1–4</b>30→45 reps + 3km · deficit</div></div>
    <div class="tl-item ${week>4&&week<=8?'active':''}"><div class="num">2</div><div class="txt"><b>Month 2 · wk 5–8</b>50 reps + 5km</div></div>
    <div class="tl-item ${week>8&&week<=12?'active':''}"><div class="num">3</div><div class="txt"><b>Month 3 · wk 9–12</b>70 reps + 7km</div></div>
    <div class="tl-item ${week>12&&week<=16?'active':''}"><div class="num">4</div><div class="txt"><b>Month 4 · wk 13–16</b>90 reps + 8–9km</div></div>
    <div class="tl-item ${week>16?'active':''}"><div class="num">5</div><div class="txt"><b>Full Routine · wk 17+</b>100/100/100 + 10km</div></div>
  </div>

  <div class="card">
    <h2>History</h2>
    ${Object.keys(logs).sort().reverse().slice(0,30).map(d=>{
      const e=logs[d];
      const p=(e.run>0&&e.runMin>0)?` · ${fmtPace(e.runMin/e.run)}`:'';
      const s=e.rest?'rest day':`${e.pushups}/${e.situps}/${e.squats} · ${e.run}km${p}${e.weight?` · ${e.weight}kg`:''}`;
      return `<div class="hist-row"><span>${d}</span><span style="text-align:right">${s}</span><button class="del" data-d="${d}">✕</button></div>`;
    }).join('')||`<div class="empty">No entries yet. Fill in today above.</div>`}
  </div>

  <div class="card">
    <h2>Your Data</h2>
    <div class="notice ${n.w?'warn':''}" id="notice">${n.t}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="primary" id="b-dl">Download backup</button>
      <button class="primary ghost" id="b-up">Restore backup</button>
    </div>
    <input type="file" id="f-in" accept="application/json,.json" style="display:none">
  </div>`;

  // handlers
  document.getElementById('b-setup').onclick=async()=>{
    profile.startWeight=parseFloat(document.getElementById('s-sw').value)||profile.startWeight;
    profile.goalWeight=parseFloat(document.getElementById('s-gw').value)||profile.goalWeight;
    profile.startDate=document.getElementById('s-sd').value||profile.startDate;
    profile.weddingDate=document.getElementById('s-wd').value||profile.weddingDate;
    await save(); render();
  };
  document.getElementById('b-w').onclick=async()=>{
    const v=parseFloat(document.getElementById('in-w').value);
    if(!isNaN(v)){ getLog(today).weight=v; await save(); render(); }
  };
  document.querySelectorAll('.ex').forEach(i=>{
    i.onchange=async()=>{ getLog(today)[i.dataset.k]=parseFloat(i.value)||0; await save(); render(); };
  });
  document.getElementById('c-rest').onchange=async e=>{ getLog(today).rest=e.target.checked; await save(); render(); };
  document.querySelectorAll('.del').forEach(b=>{
    b.onclick=async()=>{ delete logs[b.dataset.d]; await save(); render(); };
  });
  document.getElementById('b-dl').onclick=()=>{
    const blob=new Blob([JSON.stringify({profile,logs},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`training-log-${today}.json`;
    document.body.appendChild(a); a.click(); a.remove();
  };
  const fin=document.getElementById('f-in');
  document.getElementById('b-up').onclick=()=>fin.click();
  fin.onchange=()=>{
    const f=fin.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=async()=>{
      try{
        const p=JSON.parse(rd.result);
        if(p.profile) profile=p.profile;
        if(p.logs) logs=p.logs;
        await save(); render();
      }catch(e){
        document.getElementById('notice').textContent="That file couldn't be read. Pick a backup downloaded from this tracker.";
      }
    };
    rd.readAsText(f);
  };
  const st=document.getElementById('stamp');
  if(status(today,t)==='full') st.classList.add('show');
}

(async()=>{
  try{ await load(); }catch(e){ profile=defProfile(); logs={}; }
  try{ render(); }
  catch(e){ console.error(e); document.getElementById('app').innerHTML='<div class="loading">Something broke. Reload the page.</div>'; }
})();
</script>
</body>
</html>
